name: FlightRadar24 Scraper

on:
  # ── Trigger manual dari GitHub UI ──────────────────────────────────────
  workflow_dispatch:
    inputs:
      mode:
        description: 'Data yang diambil'
        required: true
        default: 'yesterday'
        type: choice
        options:
          - yesterday   # H-1 ← default
          - today       # Hari ini

  # ── Otomatis harian, ambil data H-1 ────────────────────────────────────
  # Empat jadwal: utama + tiga cadangan. Cadangan otomatis dilewati kalau data
  # H-1 sudah ada, jadi hanya benar-benar jalan saat percobaan sebelumnya gagal
  # (FR24 kadang memblokir sesaat, biasanya reda beberapa jam kemudian).
  # Sengaja dimajukan ke dini hari: makin awal di-scrape, makin sedikit jam
  # yang harus dimundurkan lewat 'Load earlier flights', jadi data lebih utuh.
  # Menit :15 dipakai untuk menghindari antrean runner di menit :00.
  # ── JADWAL DINONAKTIFKAN SEMENTARA (14 Sep 2026) ──────────────────────
  # FR24 merombak halaman data & memperketat anti-bot: endpoint airport.json
  # yang disadap scraper sudah tidak dipanggil lagi, dan permintaan "Earlier
  # flights" membalas 403 dari runner. Akibatnya tiap run mengumpulkan 0 baris,
  # gagal, lalu menerbitkan issue tiap hari. Jadwal dimatikan agar tidak
  # menumpuk notifikasi sampah sampai jalan keluarnya diputuskan.
  # Trigger manual (workflow_dispatch) sengaja tetap aktif untuk uji coba.
  # Cara menghidupkan lagi: hapus tanda # pada empat baris cron di bawah.
  # schedule:
  #   - cron: '15 18 * * *'  # 01.15 WIB — utama
  #   - cron: '15 22 * * *'  # 05.15 WIB — cadangan 1
  #   - cron: '15 2 * * *'   # 09.15 WIB — cadangan 2
  #   - cron: '15 6 * * *'   # 13.15 WIB — cadangan 3

permissions:
  contents: write   # untuk commit & push hasil ke repo
  issues: write     # untuk buat issue notifikasi jika gagal

jobs:
  scrape:
    runs-on: ubuntu-latest
    # Run normal ~15 menit (13 bandara). Run yang gagal memakan ~3x lebih lama
    # karena retry, jadi beri ruang lega supaya job tidak dibatalkan di tengah
    # retry dan notifikasi tetap terkirim.
    timeout-minutes: 90

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # Cadangan siang tidak perlu jalan kalau data H-1 sudah berhasil diambil
      # pada percobaan sebelumnya. Hanya berlaku untuk jadwal otomatis —
      # trigger manual selalu dijalankan (mis. sengaja scrape ulang).
      - name: Cek apakah data H-1 sudah ada
        id: cek
        run: |
          TARGET=$(TZ=Asia/Jakarta date -d 'yesterday' +%y%m%d)
          echo "Target H-1: $TARGET"
          if [ "${{ github.event_name }}" = "schedule" ] && [ -f "csv/${TARGET}-Flightradar.csv" ]; then
            echo "Data sudah ada — lewati run ini."
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup Python
        if: steps.cek.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        if: steps.cek.outputs.skip != 'true'
        run: |
          sudo apt-get update
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run scraper (retry 3x jika gagal)
        if: steps.cek.outputs.skip != 'true'
        run: |
          for i in 1 2 3; do
            echo "=== Attempt $i ==="
            python scrape_board.py ${{ github.event.inputs.mode || 'yesterday' }} && break
            if [ $i -lt 3 ]; then
              echo "Gagal, coba lagi dalam 30 detik..."
              sleep 30
            else
              echo "Gagal setelah 3x percobaan"
              exit 1
            fi
          done

      - name: Commit & push hasil ke repo
        if: steps.cek.outputs.skip != 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add excel csv
          git diff --cached --quiet || git commit -m "data: $(ls -t excel/*.xlsx | head -1 | xargs basename | sed 's/.xlsx//')"
          git push

      # ── Notifikasi otomatis via GitHub Issue jika gagal ─────────────────
      # cancelled() ikut ditangkap: job yang kena timeout berstatus "cancelled",
      # bukan "failure", sehingga dulu lolos tanpa notifikasi.
      # Hanya terbit dari percobaan TERAKHIR hari itu (cadangan 13.15 WIB) atau
      # trigger manual — supaya satu hari gagal tidak menghasilkan 3 issue.
      - name: Buat issue jika gagal
        if: >
          (failure() || cancelled()) &&
          (github.event.schedule == '15 6 * * *' || github.event_name == 'workflow_dispatch')
        uses: actions/github-script@v7
        with:
          script: |
            const date = new Date().toLocaleDateString('id-ID', {
              timeZone: 'Asia/Jakarta',
              day: '2-digit', month: 'long', year: 'numeric'
            });
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `❌ Scraper gagal — ${date}`,
              body: [
                '## Scraper FlightRadar24 Gagal',
                '',
                `**Tanggal:** ${date}`,
                `**Run:** [Lihat log di sini](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
                '',
                '### Kemungkinan penyebab:',
                '- FlightRadar24 memblokir sementara (anti-bot)',
                '- Timeout saat membuka halaman',
                '- Job kena batas waktu (status "cancelled") — retry 3x kelamaan',
                '- Perubahan struktur halaman FR24',
                '',
                '### Solusi:',
                '1. Klik link run di atas untuk lihat detail error',
                '2. Coba trigger manual: **Actions → Run workflow**',
                '3. Kalau masih gagal, ping @heyhrris',
              ].join('\n'),
            });
